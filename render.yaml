services:
  - type: web
    name: fsb-reconciliation
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --timeout 300 --graceful-timeout 30 --keep-alive 5 --bind 0.0.0.0:$PORT server:app
    envVars:
      - key: FSB_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
